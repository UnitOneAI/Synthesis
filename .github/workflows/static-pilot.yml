name: Static portfolio pilot
on:
  pull_request:
    paths: ['packages/static-pilot/**', '.github/workflows/static-pilot.yml']
  push:
    branches: [main, 'codex/static-multirepo-pilot']
    paths: ['packages/static-pilot/**', '.github/workflows/static-pilot.yml']
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/static-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/static-pilot/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test

  browser:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/static-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/static-pilot/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node --input-type=module -e "import { sqliteSupported } from './src/graph-store.mjs'; if (!sqliteSupported()) throw Error('Qualified SQLite runtime required for disk browser tests');"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-${{ matrix.os }}
          path: packages/static-pilot/test-results
          retention-days: 7

  cwe-engine:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/static-pilot
    env:
      SYNTHESIS_TEST_SEMGREP: semgrep
      PYTHONUTF8: '1'
      SEMGREP_SEND_METRICS: 'off'
      SEMGREP_ENABLE_VERSION_CHECK: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install semgrep==1.185.0
      - run: npm ci --ignore-scripts
      - run: node --test test/cwe-scan.test.mjs test/connection-discovery.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test test/browser/cwe.spec.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cwe-failure-${{ matrix.os }}
          path: packages/static-pilot/test-results
          retention-days: 7
