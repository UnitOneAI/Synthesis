name: Static portfolio pilot
on:
  pull_request:
    paths: ['packages/static-pilot/**', '.github/workflows/static-pilot.yml']
  push:
    branches: [main, 'codex/static-multirepo-pilot']
    paths: ['packages/static-pilot/**', '.github/workflows/static-pilot.yml']
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/static-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/static-pilot/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
